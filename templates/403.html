{% extends "base.html" %}
{% block title %}Access denied | GovGL{% endblock %}
{% block content %}
<p class="crumb">Error 403</p>
<h1>Access denied</h1>
<hr class="rule">
<div class="panel narrow">
  <p>Your account does not have permission to open this page.</p>
  <div class="actions">
    {% if user.is_authenticated %}
      <a class="btn" href="{% url 'dashboard' %}">Go to my dashboard</a>
    {% else %}
      <a class="btn" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </div>
</div>
{% endblock %}
